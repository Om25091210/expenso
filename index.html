<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Month-End Money Plan</title>
<meta name="description" content="Plan bills, track daily and adhoc spending, and check whether you're on pace for your savings goal.">
<meta name="theme-color" content="#1F6B4F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Money Plan">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow ledger column, five tabs — Today (log + glance), Plan (inputs), Log, Goal, Months */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --ink:#16231D; --muted:#5D6B64; --line:#D3DDD7;
  --accent:#1F6B4F; --accent-soft:#DCEDE4;
  --warn:#9A5B00; --warn-soft:#FBEBD0; --bad:#B42318; --bad-soft:#FBE1DE; --good:#1F6B4F;
  --display:"Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1613; --surface:#17211C; --ink:#E3ECE7; --muted:#93A39B; --line:#2A3832;
  --accent:#5DC79A; --accent-soft:#1D3A2D; --warn:#F0B44C; --warn-soft:#3A2C12; --bad:#FF8A7E; --bad-soft:#3E1C19; --good:#5DC79A;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#17211C; --ink:#E3ECE7; --muted:#93A39B; --line:#2A3832;
  --accent:#5DC79A; --accent-soft:#1D3A2D; --warn:#F0B44C; --warn-soft:#3A2C12; --bad:#FF8A7E; --bad-soft:#3E1C19; --good:#5DC79A;
  color-scheme:dark }
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-block:22px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:grid;gap:18px}
main{display:grid;gap:18px}
h1{font-family:var(--display);font-weight:700;font-size:1.7rem;line-height:1.15;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:1.12rem;margin:0}
h3{font-family:var(--display);font-weight:700;font-size:.95rem;margin:0}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.sync{letter-spacing:0;text-transform:none;white-space:nowrap}
.sync.ok{color:var(--accent)} .sync.offline,.sync.conflict{color:var(--warn)} .sync.error{color:var(--bad)}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:14px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:.85rem;margin:0}
label{font-size:.78rem;color:var(--muted);font-weight:500}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
input.num{font-family:var(--mono)}
input[type=checkbox]{width:20px;height:20px;padding:0;accent-color:var(--accent);cursor:pointer}
input:disabled,select:disabled{opacity:.55}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;cursor:pointer;border-radius:6px}
a.link,button.link{background:none;border:0;padding:0;color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:2px}
.btn{background:transparent;border:1px dashed var(--line);color:var(--accent);padding:8px 12px;font-weight:500;justify-self:start}
.btn:hover{border-color:var(--accent)}
.btn.solid{background:var(--accent);border:1px solid var(--accent);color:var(--surface);font-weight:600;padding:9px 16px}
.btn.solid:hover{filter:brightness(1.07)}
.btn.line{border-style:solid}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad)}
.x{background:transparent;border:1px solid transparent;color:var(--muted);height:36px;min-width:34px;font-size:1.1rem}
.x:hover{color:var(--bad);border-color:var(--line)}
.field{display:grid;gap:6px;align-content:start}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}

/* nav */
.tabs{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs>div{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding-inline:max(8px, env(safe-area-inset-left, 0px))}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;border-radius:0;padding:11px 4px 9px;color:var(--muted);font-weight:500;font-size:.85rem;display:grid;justify-items:center;gap:2px}
.tabs svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current=page]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

/* summary tiles */
.big{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.big>div{background:var(--surface);padding:12px 14px;display:grid;gap:2px;align-content:start}
.big .v{font-family:var(--mono);font-size:1.15rem;font-weight:600;overflow-wrap:anywhere}
.big .free .v{color:var(--accent)}
.big .free.neg .v{color:var(--bad)}
.status{border-radius:8px;padding:12px 14px;font-weight:500}
.status.ok,.verdict.ok{background:var(--accent-soft);color:var(--good)}
.status.warn,.verdict.warn{background:var(--warn-soft);color:var(--warn)}
.status.bad,.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict{border-radius:8px;padding:14px 16px;display:grid;gap:6px}
.verdict h3{font-size:1.02rem}
.verdict p{margin:0;font-weight:500}
.verdict ul{margin:2px 0 0;padding-left:1.1em;display:grid;gap:3px;font-weight:400}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.pill{display:inline-block;font-size:.7rem;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.res{background:var(--warn-soft);color:var(--warn)}
.pill.mute{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.tw{overflow-x:auto}
.paid{color:var(--muted);font-size:.82rem}
.limit{display:flex;gap:18px;flex-wrap:wrap}
.limit div{display:grid}
.limit .v{font-family:var(--mono);font-size:1.4rem;font-weight:600;color:var(--accent)}

/* hero */
.hero .hv{font-family:var(--mono);font-size:2.6rem;font-weight:600;line-height:1.1;color:var(--accent)}
.hero .hv.warn{color:var(--warn)} .hero .hv.bad{color:var(--bad)}
.bar{position:relative;height:10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);overflow:visible}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--accent)}
.bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}
.bar b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55;border-radius:1px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* log form */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:6px 12px;border-radius:999px;font-size:.85rem;font-weight:500}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chip.adhoc[aria-pressed=true]{background:var(--warn);border-color:var(--warn)}
.qa{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.qa .amt input{font-size:1.4rem;font-weight:600;padding:8px 10px}

/* bills and income rows */
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:28px minmax(0,2fr) minmax(0,1fr) 64px minmax(0,1.3fr) 34px;grid-template-areas:"ck nm am qt ac x";gap:8px;align-items:center}
.row.inc{grid-template-columns:28px minmax(0,2fr) minmax(0,1fr) minmax(0,1.3fr) 34px;grid-template-areas:"ck nm am ac x"}
.row.labels{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.row .ck{grid-area:ck} .row .nm{grid-area:nm} .row .am{grid-area:am} .row .qt{grid-area:qt} .row .ac{grid-area:ac} .row .x{grid-area:x}
.row.done .nm{text-decoration:line-through;color:var(--muted)}
.accts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.acct{display:grid;gap:6px;border:1px solid var(--line);border-radius:8px;padding:8px}
.acct .bal{display:grid;grid-template-columns:minmax(0,1fr) 36px;gap:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ledger list */
.list{display:grid}
.tx{display:grid;grid-template-columns:54px minmax(0,1fr) auto 34px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx .d{font-size:.78rem;color:var(--muted)}
.tx .m{display:grid;gap:2px;min-width:0}
.tx .m b{font-weight:500;overflow-wrap:anywhere}
.tx .m span{font-size:.8rem;color:var(--muted)}
.tx .a{font-weight:600;text-align:right;white-space:nowrap}
.tx .a.in{color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:14px 0}

/* category bars */
.cats{display:grid;gap:9px}
.cat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:.88rem}
.cat .t{grid-column:1 / -1;display:flex;height:8px;border-radius:999px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.cat .t i{display:block;background:var(--accent)} .cat .t i.ad{background:var(--warn)}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--accent);margin-right:5px}
.legend span.ad::before{background:var(--warn)}

/* goal */
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kv div{display:grid;gap:1px}
.kv .v{font-family:var(--mono);font-weight:600;font-size:1.05rem}
.plot{position:relative;height:140px;display:flex;align-items:flex-end;gap:10px;border-bottom:1px solid var(--line);margin-top:18px}
.plot .col{position:relative;flex:1;height:100%}
.plot .stack{position:absolute;left:14%;right:14%;bottom:0;display:flex;flex-direction:column-reverse;min-height:2px}
.plot .stack i{display:block;min-height:0}
.plot .sv{background:var(--accent);border-radius:3px 3px 0 0}
.plot .ad{background:var(--accent-soft);border:1.5px dashed var(--accent);border-bottom:0;border-radius:3px 3px 0 0}
.plot .val{position:absolute;left:0;right:0;text-align:center;font-size:.7rem;color:var(--muted);font-family:var(--mono)}
.plot .need{position:absolute;left:0;right:0;border-top:2px dashed var(--warn);pointer-events:none}
.plot .need span{position:absolute;right:0;top:-1.5em;font-size:.72rem;color:var(--warn);background:var(--surface);padding-left:4px;font-weight:600}
.plot-labels{display:flex;gap:10px;font-size:.75rem;color:var(--muted);text-align:center}
.plot-labels span{flex:1}

ol.method{margin:0;padding-left:1.2em;display:grid;gap:8px;max-width:64ch}
details summary{cursor:pointer;font-family:var(--display);font-weight:700;font-size:1.05rem}
details[open] summary{margin-bottom:12px}

/* dialog + toast */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);width:min(580px,calc(100% - 20px));padding:0;max-height:90vh}
dialog::backdrop{background:rgba(5,12,9,.55)}
.dlg{padding:20px;display:grid;gap:14px}
.dlg hr{border:0;border-top:1px solid var(--line);margin:0;width:100%}
.dl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.92rem}
.dl dt{color:var(--muted)} .dl dd{margin:0;text-align:right;font-family:var(--mono)}
.chk{display:flex;gap:10px;align-items:center;font-size:.92rem;color:var(--ink)}
.chk span:last-child{margin-left:auto;font-family:var(--mono)}
.acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;display:flex;gap:14px;align-items:center;z-index:50;max-width:calc(100% - 24px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast button{color:var(--bg);text-decoration:underline;background:none;border:0;font-weight:600;padding:0}

@media (max-width:640px){
  .wrap{padding-block:16px 32px;gap:14px} main{gap:14px}
  h1{font-size:1.45rem}
  section.card{padding:14px}
  /* 16px inputs stop iOS zooming in on focus; taller targets for thumbs */
  input,select{font-size:16px;min-height:42px}
  input[type=checkbox]{min-height:0;width:22px;height:22px}
  .btn,.chip{min-height:40px}
  .chip{padding:8px 14px}
  .x{height:42px;min-width:40px}
  .g3,.kv{grid-template-columns:1fr}
  /* tables become one card per row */
  table.stack-t thead{display:none}
  table.stack-t,.stack-t tbody{display:block}
  .stack-t tr{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
  .stack-t td{border:0;padding:0;text-align:left!important;min-width:0}
  .stack-t td[data-l]::before{content:attr(data-l);display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .stack-t td.first{grid-column:1 / -1;font-weight:600;font-family:var(--display);font-size:1rem}
  .stack-t td.full{grid-column:1 / -1}
  .stack-t td.o1{order:1} .stack-t td.o2{order:2;justify-self:end} .stack-t td.o3{order:3} .stack-t td.o4{order:4} .stack-t td.o5{order:5}
  /* dialog becomes a bottom sheet */
  dialog{width:100%;max-width:none;margin:auto 0 0;border-radius:16px 16px 0 0;max-height:92vh}
  .dlg{padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  .acts{display:grid;grid-template-columns:1fr 1fr}
  .acts .btn{justify-self:stretch;text-align:center}
  .kv{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2{grid-template-columns:1fr 1fr}
  .big{grid-template-columns:repeat(2,minmax(0,1fr))}
  .qa{grid-template-columns:1fr}
  .row{grid-template-columns:28px minmax(0,1fr) 64px minmax(0,1.2fr) 34px;grid-template-areas:"ck nm nm nm x" ". am qt ac ac"}
  .row.inc{grid-template-columns:28px minmax(0,1fr) minmax(0,1.2fr) 34px;grid-template-areas:"ck nm nm x" ". am ac ac"}
  .row.labels{display:none}
  .hero .hv{font-size:2.3rem}
  .tabs{position:fixed;top:auto;bottom:0;left:0;right:0;border-bottom:0;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabs button{border-bottom:0;border-top:3px solid transparent;padding:7px 2px 6px;font-size:.72rem}
  .tabs button[aria-current=page]{border-top-color:var(--accent)}
  body{padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))}
  #toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:380px){
  .big .v{font-size:1rem} .hero .hv{font-size:2rem} .tabs button{font-size:.68rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<nav class="tabs" aria-label="Sections"><div id="tabs"></div></nav>
<div class="wrap">
  <header>
    <div class="eyebrow top"><span id="dateLine">Month-end plan</span><span id="syncState" class="sync" hidden></span></div>
    <h1>Month-End Money Plan</h1>
  </header>
  <main id="view"></main>
</div>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
/* ---------- constants ---------- */
const KEY="mep-v2", OLD="mep-v1", MAX_ACCTS=8;
const CATS=["Food","Transport","Shopping","Health","Gifts & social","Repairs","Fun","Bills & fees","Other"];
const SIGN={daily:-1,adhoc:-1,bill:-1,income:1,save:-1,withdraw:1};   // effect on the account balance
const TYPE_LABEL={daily:"Day-to-day",adhoc:"Adhoc",bill:"Bill",income:"Income",save:"To savings",withdraw:"From savings"};
const TYPE_PILL={daily:"mute",adhoc:"res",bill:"mute",income:"ok",save:"ok",withdraw:"mute"};
const TABS=[
  ["today","Today",'<path d="M3 11l9-8 9 8v10H3z"/>'],
  ["plan","Plan",'<path d="M4 6h16M4 12h16M4 18h10"/>'],
  ["log","Log",'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>'],
  ["goal","Goal",'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>'],
  ["months","Months",'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>']
];

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid = () => Math.random().toString(36).slice(2,9);
const fmt = n => { const r=Math.round(n); return (r<0?"−":"")+"₹"+Math.abs(r).toLocaleString("en-IN") };
const sum = (a,f) => a.reduce((s,x)=>s+f(x),0);
function today(){ const d=new Date(); d.setHours(0,0,0,0); return d }
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0") }
const pd = s => new Date(s+"T00:00");
function addDays(s,n){ const d=pd(s); d.setDate(d.getDate()+n); return iso(d) }
const monthEndOf = d => new Date(d.getFullYear(), d.getMonth()+1, 0);
const monthLabel = (s,short) => pd(s).toLocaleDateString("en-IN",{month:short?"short":"long",year:short?undefined:"numeric"});
const fdate = s => pd(s).toLocaleDateString("en-IN",{day:"numeric",month:"short"});
const bv = b => (+b.amt||0)*(+b.qty||1);
const isoOk = s => /^\d{4}-\d{2}-\d{2}$/.test(s);
const ymOk = s => /^\d{4}-(0[1-9]|1[0-2])$/.test(s);

/* ---------- state ---------- */
function blank(){
  const t=today();
  return {v:2,
    accounts:[{name:"Bank A",bal:3612},{name:"Bank B",bal:805},{name:"Bank C",bal:2257},{name:"Bank D",bal:0}],
    period:{start:iso(t),end:iso(monthEndOf(t))},
    bills:[
      {id:uid(),name:"Wi-Fi bill",amt:470,qty:1,acct:1,paid:false},
      {id:uid(),name:"Phone recharge",amt:300,qty:1,acct:1,paid:false},
      {id:uid(),name:"Second phone bill",amt:295,qty:1,acct:2,paid:false},
      {id:uid(),name:"Office travel (per trip)",amt:300,qty:3,acct:2,paid:false}],
    incomes:[], daily:{amt:400,acct:2},
    txns:[], savings:0, goal:null, history:[]};
}
// Accepts the current format, the old v1 format, or an imported backup; anything malformed falls back to defaults.
function normalize(o){
  const n=blank(); if(!o||typeof o!=="object") return n;
  const num=(v,d=0)=>Number.isFinite(+v)?+v:d;
  const legacy=!o.v && Array.isArray(o.items);
  if(Array.isArray(o.accounts)&&o.accounts.length) n.accounts=o.accounts.slice(0,MAX_ACCTS).map(a=>({name:String(a&&a.name||"Account"),bal:num(a&&a.bal)}));

  const line=(b,flag)=>({id:String(b&&b.id||uid()),name:String(b&&b.name||"Item"),amt:num(b&&b.amt),qty:Math.max(1,num(b&&b.qty,1)),acct:acct(b&&b.acct),[flag]:!legacy&&!!(b&&b[flag])});

  } else if(o.period&&isoOk(o.period.start)&&isoOk(o.period.end)&&o.period.end>=o.period.start) n.period={start:o.period.start,end:o.period.end};
  if(o.daily) n.daily={amt:num(o.daily.amt),acct:acct(o.daily.acct)};
  if(Array.isArray(o.txns)) n.txns=o.txns.filter(x=>x&&SIGN[x.type]&&isoOk(x.date)&&num(x.amt)>0)
    .map(x=>({id:String(x.id||uid()),type:x.type,amt:num(x.amt),acct:+x.acct===-1?-1:acct(x.acct),date:x.date,note:String(x.note||""),cat:String(x.cat||""),ref:String(x.ref||"")}));

  if(Array.isArray(o.history)) n.history=o.history.filter(h=>h&&isoOk(h.end)).map(h=>({label:String(h.label||""),start:String(h.start||""),end:h.end,
    income:num(h.income),bills:num(h.bills),budget:num(h.budget),daily:num(h.daily),adhoc:num(h.adhoc),saved:num(h.saved),cash:num(h.cash),need:num(h.need),hasGoal:!!h.hasGoal}));

let S;
try{
  const cur=localStorage.getItem(KEY), old=localStorage.getItem(OLD);
  S=normalize(JSON.parse(cur||old||"null"));
}catch(e){ S=blank() }

function save(){                                                                       // a local edit: also queue it for the cloud
  persist();

/* ---------- money movement ---------- */
// Every logged entry moves a live balance. dir=-1 undoes it.
function applyTx(t,dir){
  const a=S.accounts[t.acct];
  if(a) a.bal=(+a.bal||0)+dir*SIGN[t.type]*t.amt;
  if(t.type==="save") S.savings=Math.max(0,S.savings+dir*t.amt);
  if(t.type==="withdraw") S.savings=Math.max(0,S.savings-dir*t.amt);
}
function addTx(x){
  const t={id:uid(),type:x.type,amt:x.amt,acct:x.acct,date:x.date||iso(today()),note:(x.note||"").trim(),cat:x.cat||"",ref:x.ref||""};
  S.txns.push(t); applyTx(t,1); save(); return t;
}
function removeTx(id){
  const i=S.txns.findIndex(x=>x.id===id); if(i<0) return;
  const t=S.txns[i]; applyTx(t,-1); S.txns.splice(i,1);
  if(t.ref){ const b=(t.type==="bill"?S.bills:S.incomes).find(b=>b.id===t.ref); if(b){ b.paid=false; b.got=false } }
  save();
}

/* ---------- derived numbers ---------- */
function calc(){
  const t=today(), ti=iso(t), P=S.period, start=pd(P.start), end=pd(P.end);
  const t0=t<start?start:t;                                   // planning a month early still divides by its full length
  const days=Math.max(1,Math.round((end-t0)/864e5)+1);
  const totalDays=Math.max(1,Math.round((end-start)/864e5)+1);
  const dayNo=Math.min(totalDays,Math.max(1,totalDays-days+1));
  const inP=S.txns.filter(x=>x.date>=P.start&&x.date<=P.end);
  const tot=ty=>sum(inP.filter(x=>x.type===ty),x=>x.amt);
  const c={ti,end,ended:t>end,days,totalDays,dayNo,inP};
  c.cash=sum(S.accounts,a=>+a.bal||0);
  c.dailySpent=tot("daily"); c.adhoc=tot("adhoc"); c.billsPaid=tot("bill"); c.incomeIn=tot("income");
  c.savedNet=tot("save")-tot("withdraw");
  const budget=+S.daily.amt||0;
  c.budget=budget;
  c.dailyLeft=Math.max(0,budget-c.dailySpent);
  c.dailyOver=Math.max(0,c.dailySpent-budget);
  c.spentToday=sum(S.txns.filter(x=>x.type==="daily"&&x.date===ti),x=>x.amt);
  c.limitToday=(c.dailyLeft+c.spentToday)/days;
  c.leftToday=c.dailyLeft>0?c.limitToday-c.spentToday:0;

  c.per=S.accounts.map(()=>({out:0,inc:0,list:[]}));
  S.bills.filter(b=>!b.paid).forEach(b=>{ const p=c.per[b.acct]; if(!p) return; const v=bv(b); p.out+=v;
    p.list.push(b.name+(b.qty>1?` (${b.qty}×${fmt(b.amt)})`:"")+" "+fmt(v)) });
  S.incomes.filter(i=>!i.got).forEach(i=>{ const p=c.per[i.acct]; if(!p) return; const v=bv(i); p.inc+=v; p.list.push("Incoming: "+i.name+" "+fmt(v)) });
  const dp=c.per[S.daily.acct];
  if(dp&&c.dailyLeft>0){ dp.out+=c.dailyLeft; dp.list.push("Day-to-day (left) "+fmt(c.dailyLeft)) }
  c.billsDue=sum(S.bills.filter(b=>!b.paid&&c.per[b.acct]),bv);
  c.incoming=sum(S.incomes.filter(i=>!i.got&&c.per[i.acct]),bv);
  c.committed=c.billsDue+c.dailyLeft;
  c.free=c.cash+c.incoming-c.committed;

  c.g=S.goal?goalCalc(c):null;
  return c;
}
function monthsToGo(fromISO,by){            // months from fromISO's month to the goal month, both included
  const [gy,gm]=by.split("-").map(Number), d=pd(fromISO);
  return (gy-d.getFullYear())*12+(gm-(d.getMonth()+1))+1;
}
function goalCalc(c){
  const g=S.goal, t=today();
  const r={};
  r.remaining=Math.max(0,g.target-S.savings);
  r.reached=r.remaining<=0;
  const raw=monthsToGo(S.period.end,g.by);
  r.overdue=raw<1; r.monthsLeft=Math.max(1,raw);
  const remStart=Math.max(0,g.target-(S.savings-c.savedNet));      // what was still needed when this month began
  r.need=remStart/r.monthsLeft;
  r.projected=c.savedNet+Math.max(0,c.free);                        // saved so far + everything spare, if it all goes to savings
  r.gap=r.need-r.projected;
  const span=Math.max(1,monthEndOf(pd(g.by+"-01"))-pd(g.start));
  const frac=Math.min(1,Math.max(0,(t-pd(g.start))/span));
  r.expected=g.startSaved+(g.target-g.startSaved)*frac;
  r.pct=Math.min(100,S.savings/g.target*100);
  r.monthsAtPace=r.projected>0?Math.ceil(remStart/r.projected):Infinity;
  r.late=r.monthsAtPace-r.monthsLeft;
  if(r.reached){
    r.v={level:"ok",title:"Goal reached",msg:`You've saved ${fmt(S.savings)} against a target of ${fmt(g.target)}.`,notes:[]};
  } else if(r.gap<=0){
    const cushion=-r.gap, notes=[];
    if(c.adhoc>0) notes.push(`Adhoc spending so far is ${fmt(c.adhoc)}. It hasn't derailed you, but one more adhoc spend above ${fmt(cushion)} would.`);
    else notes.push(`You have ${fmt(cushion)} of cushion before an adhoc spend starts hurting.`);
    if(c.free>0&&S.savings<g.target) notes.push(`${fmt(Math.max(0,c.free))} is spare right now. Moving it into savings locks the progress in.`);
    r.v={level:"ok",title:"On track",msg:`You can save about ${fmt(r.projected)} this month. The goal needs ${fmt(r.need)}.`,notes};
  } else {
    const A=c.adhoc, O=c.dailyOver, notes=[];
    let title,level,msg;
    if(A>=r.gap){ level="bad"; title="Adhoc spending is what's blocking your goal"; msg=`You're ${fmt(r.gap)} short of this month's saving target, and you've spent ${fmt(A)} on adhoc items. Without them you'd be on track.`; }
    else if(A+O>=r.gap){ level="bad"; title="Adhoc and overspending are blocking your goal"; msg=`You're ${fmt(r.gap)} short. Adhoc spends (${fmt(A)}) plus going over the day-to-day budget (${fmt(O)}) account for it.`; }
    else if(A>0){ level="warn"; title="Behind pace, and adhoc is part of it"; msg=`You're ${fmt(r.gap)} short. Adhoc spending (${fmt(A)}) explains only part of it. The rest is that your plan leaves little after bills and day-to-day money.`; }
    else { level="warn"; title="Behind pace"; msg=`You're ${fmt(r.gap)} short, and it isn't adhoc spending. After bills and day-to-day money the plan leaves too little. The goal needs ${fmt(r.need)} a month.`; }
    if(c.dailyLeft>=r.gap) notes.push(`Catch up by trimming day-to-day spending by ${fmt(r.gap/c.days)} a day for the remaining ${c.days} ${c.days===1?"day":"days"}.`);
    else if(c.dailyLeft>0) notes.push(`Even cutting all remaining day-to-day money (${fmt(c.dailyLeft)}) won't close the gap this month.`);
    if(Number.isFinite(r.late)&&r.late>0) notes.push(`Or move the deadline out by ${r.late} ${r.late===1?"month":"months"}. At this pace you'd finish around ${monthLabel(addMonthISO(S.period.start,r.monthsAtPace-1))}.`);
    else if(!Number.isFinite(r.late)) notes.push(`At this pace nothing reaches savings, so the goal can't be met.`);
    r.v={level,title,msg,notes};
  }
  if(r.overdue&&!r.reached) r.v.notes.unshift(`The deadline (${monthLabel(g.by+"-01")}) has passed. Update it in the Goal tab.`);
  return r;
}
function addMonthISO(s,n){ const d=pd(s); return iso(new Date(d.getFullYear(),d.getMonth()+n,1)) }

function statusOf(c){
  const left=i=>(+S.accounts[i].bal||0)+c.per[i].inc-c.per[i].out;
  const short=S.accounts.map((a,i)=>({i,name:a.name,left:left(i)})).filter(x=>x.left<0);
  if(c.free<0) return ["bad",`You're ${fmt(-c.free)} short overall. Cut the day-to-day amount, delay a bill, or wait for income.`];
  if(short.length){
    const s=short[0];
    const donor=S.accounts.map((a,i)=>({name:a.name,left:left(i)})).filter(x=>x.left>=-s.left).sort((a,b)=>b.left-a.left)[0];
    return ["warn",`${s.name} is ${fmt(-s.left)} short. `+(donor?`Move a bill to ${donor.name}, or transfer ${fmt(-s.left)} from ${donor.name}.`:`Move a bill to another account.`)];
  }
  if(c.free<c.cash*0.1) return ["warn",`Every bill is covered, but only ${fmt(c.free)} is free. Treat it as emergency money only.`];
  return ["ok",`Every bill is covered and every account stays positive. ${fmt(c.free)} stays free after month end.`];
}

/* ---------- cloud sync (optional; a Google Apps Script web app on your own Sheet, see apps-script/Code.gs) ---------- */
// Local-first: every edit lands in localStorage immediately and is pushed in the background.
// rev is the server revision this device last saw; a push is refused (409) if the cloud moved on.
// Paste your web app URL here once to skip typing it on every device, or leave it empty and enter it in the Months tab.
const SYNC_URL="https://script.google.com/macros/s/AKfycbx7Iio5fecKQ8F6GNKoegU4MxyVVS63nxvX2Hh_oJo6COTvGuDDDbQLAroz4KkaHmNE0A/exec";
const SCRIPT_URL=/^https:\/\/script\.google\.com\/(a\/macros\/[\w.-]+\/)?macros\/s\/[\w-]+\/exec$/;
let SY={on:false,declined:false,key:"",url:"",rev:0,dirty:false,localAt:0,last:null}, SYNC={state:"off",msg:""}, pushT=0, pushing=false, CONFLICT=null;
try{ Object.assign(SY,JSON.parse(localStorage.getItem("mep-sync")||"{}")) }catch(e){}
if(SY.key&&!SY.on&&!SY.declined) SY.on=true;   // saved by an earlier build
function saveSY(){ try{ localStorage.setItem("mep-sync",JSON.stringify(SY)) }catch(e){} }
const SYLABEL={ok:"Synced",busy:"Syncing…",offline:"Offline",error:"Sync problem",conflict:"Needs attention",off:""};
const stamp=s=>new Date(s).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});
const syText=()=>SYNC.msg||(SY.last?"Last synced "+stamp(SY.last):"");
function setSync(state,msg){
  SYNC={state,msg:msg||""};
  const el=$("syncState");
  if(el){ el.hidden=!SY.on; el.className="sync "+state; el.textContent="● "+SYLABEL[state]; el.title=SYNC.msg }
  const st=$("syStatus"); if(st) st.textContent=syText();
}
// Apps Script can't answer a CORS preflight or set status codes, so: text/plain POST, passphrase in the body, status in the reply.
async function api(op,body){
  const url=SYNC_URL||SY.url;
  if(!SCRIPT_URL.test(url||"")) return {status:0,j:null};
  const json=JSON.stringify({op,key:SY.key||"",...body});
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:json,keepalive:json.length<60000});
  let j=null; try{ j=await r.json() }catch(e){}
  return {status:(j&&j.status)||0,j};
}
function queuePush(){ clearTimeout(pushT); setSync("busy","Saving…"); pushT=setTimeout(push,1200) }
function syncFailed(status){
  if(status===401) setSync("error","The sync script now needs a passphrase. Turn sync off, then connect again to enter it.");
  else if(status===0) setSync("error","The sync URL didn't answer like the sync script. Check the deployment.");
  else setSync("error","The server couldn't save. Will retry.");
}
async function push(){
  if(!SY.on||pushing) return;
  if(!SY.dirty){ setSync("ok"); return }
  pushing=true; const sentAt=SY.localAt;
  try{
    const {status,j}=await api("put",{baseRev:SY.rev,data:S});
    if(status===200){ SY.rev=j.rev; SY.last=j.updatedAt; SY.dirty=SY.localAt!==sentAt; saveSY(); SY.dirty?queuePush():setSync("ok") }
    else if(status===409) resolveConflict(j);
    else syncFailed(status);
  }catch(e){ setSync("offline","Offline. Changes are kept here and will upload when you're back.") }
  finally{ pushing=false }
}
async function pull(){
  if(!SY.on||pushing||$("dlg").open) return;
  setSync("busy","Syncing…");
  try{
    const {status,j}=await api("get");
    if(status!==200) return syncFailed(status);
    if(!j.data){ SY.rev=0; SY.dirty=true; saveSY(); return push() }      // cloud empty: upload this device
    if(j.rev===SY.rev){ if(SY.dirty) return push(); setSync("ok"); return }
    if(!SY.dirty&&SY.rev>0) return adopt(j);                              // cloud is ahead and nothing here is unsynced
    resolveConflict(j);                                                   // both sides changed, or first connect
  }catch(e){ setSync("offline","Offline. Using the copy saved on this device.") }
}
function adopt(j){
  S=normalize(j.data); persist();
  SY.rev=j.rev; SY.last=j.updatedAt; SY.dirty=false; saveSY();
  render(true); setSync("ok");
}
function resolveConflict(j){
  CONFLICT=j; setSync("conflict","The cloud copy and this device differ. Choose which one to keep.");
  const cloud=normalize(j.data), n=s=>`${s.accounts.length} banks · ${s.txns.length} entries · ${fmt(sum(s.accounts,a=>+a.bal||0))}`;
  $("dlg").innerHTML=`<div class="dlg"><h2>Which copy do you want to keep?</h2>
    <p class="hint">The cloud copy and the copy on this device don't match. The one you don't pick gets overwritten.</p>
    <dl class="dl"><dt>Cloud${j.updatedAt?" (saved "+stamp(j.updatedAt)+")":""}</dt><dd>${n(cloud)}</dd><dt>This device</dt><dd>${n(S)}</dd></dl>
    <div class="acts"><button class="btn line" type="button" data-act="useCloud">Use cloud copy</button><button class="btn solid" type="button" data-act="useDevice">Keep this device</button></div>
    <button class="link" type="button" data-act="closeDlg" style="justify-self:start">Decide later</button></div>`;
  if(!$("dlg").open) $("dlg").showModal();
}
// With the web app URL built in and no passphrase on the script, a device connects by itself.
async function autoConnect(){
  try{
    const {status}=await api("get");
    if(status!==200) return;                       // protected, or unreachable: the Months tab lets the user connect by hand
    SY.on=true; SY.rev=0; SY.dirty=false; saveSY(); render(true); await pull();
  }catch(e){}
}
function syncCard(){
  if(!SY.on) return `<section class="card"><div class="head"><h2>Sync across devices</h2><span class="pill mute">Off</span></div>
    <p class="hint">Right now your data lives only in this browser. Turn on sync to keep a copy in your own Google Sheet and see the same numbers on your phone and laptop. If you set a passphrase in the script, enter it below. If you didn't, leave it empty.</p>
    ${SYNC_URL?"":`<div class="field"><label for="syUrl">Web app URL</label><input id="syUrl" type="url" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(SY.url||"")}"></div>`}
    <div class="field"><label for="syPass">Passphrase (optional)</label><input id="syPass" name="password" type="password" autocomplete="current-password" maxlength="200"></div>
    <button class="btn solid" type="button" data-act="syConnect">Connect and sync</button><p class="hint" id="syMsg" aria-live="polite"></p></section>`;
  return `<section class="card"><div class="head"><h2>Sync across devices</h2><span class="pill ok">On</span></div>
    <p class="hint" id="syStatus" aria-live="polite">${esc(syText())}</p>
    <p class="hint">Open this site on another device and enter the same passphrase to see the same data. Changes upload automatically a moment after you make them.</p>
    <div class="acts" style="justify-content:flex-start"><button class="btn line" type="button" data-act="syNow">Sync now</button><button class="btn danger" type="button" data-act="syOff">Turn off on this device</button></div></section>`;
}

/* ---------- actions ---------- */
const ACT={
  syConnect:async()=>{
    const key=($("syPass").value||"").trim(), msg=$("syMsg");
    const url=SYNC_URL||($("syUrl")?$("syUrl").value.trim():"");
    if(!SCRIPT_URL.test(url)){ msg.textContent="Paste the web app URL from Apps Script. It starts with https://script.google.com/ and ends in /exec."; return }
    const prev={...SY}; SY.key=key; SY.url=url; msg.textContent="Connecting…";
    try{
      const {status}=await api("get");
      if(status===401){ SY=prev; msg.textContent=key?"That passphrase doesn't match the one in the script.":"This sheet is protected. Enter the passphrase set in the script's properties."; return }
      if(status!==200){ SY=prev; msg.textContent="That URL didn't answer like the sync script. Check that the deployment's access is set to Anyone."; return }
    }catch(e){ SY=prev; msg.textContent="Couldn't reach the script. Check your connection and the URL."; return }
    SY.on=true; SY.declined=false; SY.rev=0; SY.dirty=false; saveSY(); render(true); await pull();
  },
  syNow:()=>pull(),
  syOff:()=>{ SY={on:false,declined:true,key:"",url:SY.url,rev:0,dirty:false,localAt:0,last:null}; saveSY(); setSync("off"); render(true); toast("Sync is off on this device. The cloud copy is untouched.") },
  useCloud:()=>{ const j=CONFLICT; CONFLICT=null; $("dlg").close(); if(j) adopt(j) },
  useDevice:()=>{ const j=CONFLICT; CONFLICT=null; $("dlg").close(); if(!j) return; SY.rev=j.rev; SY.dirty=true; saveSY(); push() },
  tab:b=>show(b.dataset.tab),
  qt:b=>{ QT=b.dataset.t; render(true); $("qAmt").focus() },
  qaAdd:()=>{
    const amt=+$("qAmt").value;
    if(!(amt>0)){ toast("Enter an amount first."); $("qAmt").focus(); return }
    const date=$("qDate").value||iso(today());
    const t=addTx({type:QT,amt,acct:+$("qAcct").value,date,note:$("qNote").value,cat:QT==="daily"||QT==="adhoc"?$("qCat").value:""});
    render(true); $("qAmt").focus();
    toast(`Added ${fmt(amt)} · ${TYPE_LABEL[t.type].toLowerCase()}`,()=>{ removeTx(t.id); render(true) });
  },
  delTx:b=>{ const id=b.dataset.id, t=S.txns.find(x=>x.id===id); if(!t) return; const copy={...t};
    removeTx(id); render(true);
    toast(`Deleted ${fmt(copy.amt)} entry`,()=>{ S.txns.push(copy); applyTx(copy,1);
      if(copy.ref){ const r=(copy.type==="bill"?S.bills:S.incomes).find(b=>b.id===copy.ref); if(r){ r.paid=copy.type==="bill"; r.got=copy.type==="income" } }
      save(); render(true) }); },
  logType:b=>{ LOGF.type=b.dataset.t; render(true) },
  logRange:b=>{ LOGF.range=b.dataset.r; render(true) },
  addRow:b=>{
    const L=b.dataset.list;
    S[L].push(L==="bills"?{id:uid(),name:"New bill",amt:0,qty:1,acct:0,paid:false}:{id:uid(),name:"Salary",amt:0,qty:1,acct:0,got:false});
    save(); render(true);
    const n=document.querySelector(`[data-list="${L}"][data-k="name"][data-i="${S[L].length-1}"]`); if(n){ n.focus(); n.select() }
  },
  delRow:b=>{
    const L=b.dataset.list, i=+b.dataset.i, it=S[L][i]; if(!it) return;
    if(it.paid||it.got){ // keep balances consistent: undo its ledger entry first
      const t=S.txns.find(x=>x.ref===it.id); if(t) removeTx(t.id) }
    S[L].splice(i,1); save(); render(true);
  },
  addAcct:()=>{
    if(S.accounts.length>=MAX_ACCTS) return;
    const n=S.accounts.length;
    S.accounts.push({name:"Bank "+String.fromCharCode(65+n),bal:0});
    save(); render(true);
    const el=document.querySelector(`[data-list=accounts][data-k=name][data-i="${n}"]`); if(el){ el.focus(); el.select() }
  },
  delAcct:b=>{
    const i=+b.dataset.i, a=S.accounts[i];
    if(!a) return;
    if(S.accounts.length<=1){ toast("Keep at least one bank."); return }
    const moved=S.bills.filter(x=>x.acct===i&&!x.paid).length+S.incomes.filter(x=>x.acct===i&&!x.got).length+(S.daily.acct===i?1:0);
    const first=S.accounts[i===0?1:0].name;
    if(!confirm(`Remove ${a.name}?`+(a.bal?` Its ${fmt(a.bal)} leaves your cash total.`:"")
      +(moved?` ${moved} planned ${moved===1?"item":"items"} will move to ${first}.`:"")+` Past log entries are kept.`)) return;
    const shift=v=>v===i?0:(v>i?v-1:v);              // items on the removed bank fall back to the first remaining one
    S.bills.forEach(x=>x.acct=shift(x.acct)); S.incomes.forEach(x=>x.acct=shift(x.acct)); S.daily.acct=shift(S.daily.acct);
    S.txns.forEach(x=>{ x.acct=x.acct===i?-1:(x.acct>i?x.acct-1:x.acct) });
    S.accounts.splice(i,1); save(); render(true);
    toast(`${a.name} removed`);
  },
  gvIn:()=>moveSavings("save"), gvOut:()=>moveSavings("withdraw"),
  saveGoal:()=>{
    const target=+$("gTarget").value, by=$("gBy").value, saved=Math.max(0,+$("gSaved").value||0);
    if(!(target>0)){ toast("Enter a target amount."); return }
    if(!ymOk(by)){ toast("Pick the month you want to reach it by."); return }
    S.savings=saved;
    const name=$("gName").value.trim()||"Savings goal";
    S.goal=S.goal?{...S.goal,name,target,by}:{name,target,by,start:iso(today()),startSaved:saved};
    save(); render(true); toast("Goal saved.");
  },
  clearGoal:()=>{ if(!confirm("Remove this goal? Your savings balance and log stay.")) return; S.goal=null; save(); render(true) },
  nextMonth:()=>openNext(),
  export:()=>{
    const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="money-plan-backup-"+iso(today())+".json";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  },
  import:()=>$("importFile").click(),
  reset:()=>{ if(!confirm("Erase all your data in this browser? Export a backup first if you want to keep it.")) return;
    try{ localStorage.removeItem(KEY); localStorage.removeItem(OLD) }catch(e){} S=blank(); save(); render() },
  closeDlg:()=>$("dlg").close(),
  startNext:()=>startNext(),
  wizSuggest:()=>{ const s=wizCalc(); $("wDaily").value=Math.round(s.suggested); wizUpdate() },
  wizMoveAll:()=>{ $("wMove").value=Math.round(Math.max(0,calc().free)); wizUpdate() }
};
function moveSavings(type){
  const amt=+$("gvAmt").value;
  if(!(amt>0)){ toast("Enter an amount."); return }
  if(type==="withdraw"&&amt>S.savings){ toast(`Only ${fmt(S.savings)} is in savings.`); return }
  addTx({type,amt,acct:+$("gvAcct").value,note:type==="save"?"Added to savings":"Withdrawn from savings"});
  render(true); toast(type==="save"?`Moved ${fmt(amt)} to savings`:`Moved ${fmt(amt)} back to ${acctName(+$("gvAcct").value)}`);
}
function togglePaid(i,on){
  const b=S.bills[i]; if(!b) return;
  if(on){ addTx({type:"bill",amt:bv(b),acct:b.acct,note:b.name,cat:"Bills & fees",ref:b.id}); b.paid=true }
  else { const t=S.txns.find(x=>x.ref===b.id&&x.type==="bill"); if(t) removeTx(t.id); b.paid=false }
  save(); render(true);
}
function toggleGot(i,on){
  const b=S.incomes[i]; if(!b) return;
  if(on){ addTx({type:"income",amt:bv(b),acct:b.acct,note:b.name,ref:b.id}); b.got=true }
  else { const t=S.txns.find(x=>x.ref===b.id&&x.type==="income"); if(t) removeTx(t.id); b.got=false }
  save(); render(true);
}

/* ---------- new month wizard ---------- */
let W=null;
function openNext(){
  const c=calc(), P=S.period;
  const ns=addDays(P.end,1), ne=iso(monthEndOf(pd(ns)));
  W={ns,ne};
  const unpaid=S.bills.filter(b=>!b.paid), g=c.g;
  const dlg=$("dlg");
  dlg.innerHTML=`<div class="dlg">
    <div><div class="eyebrow">Step 1</div><h2>How ${monthLabel(P.end)} went</h2></div>
    <dl class="dl"><dt>Income received</dt><dd>${fmt(c.incomeIn)}</dd><dt>Bills paid</dt><dd>${fmt(c.billsPaid)}</dd>
      <dt>Day-to-day spent</dt><dd>${fmt(c.dailySpent)} of ${fmt(c.budget)}</dd><dt>Adhoc spending</dt><dd>${fmt(c.adhoc)}</dd>
      <dt>Moved to savings</dt><dd>${fmt(c.savedNet)}</dd><dt>Cash in accounts</dt><dd>${fmt(c.cash)}</dd><dt>Spare after everything</dt><dd>${fmt(c.free)}</dd></dl>
    ${g&&!g.reached?`<div class="verdict ${g.v.level}"><h3>${esc(g.v.title)}</h3><p>${esc(g.v.msg)}</p></div>`:""}
    ${unpaid.length?`<div class="status warn">${unpaid.length} ${unpaid.length===1?"bill is":"bills are"} still unpaid (${fmt(sum(unpaid,bv))}). Pay ${unpaid.length===1?"it":"them"} first, or leave ${unpaid.length===1?"it":"them"} ticked below to carry over.</div>`:""}
    <hr>
    <div><div class="eyebrow">Step 2</div><h2>Set up ${monthLabel(ns)}</h2></div>
    <div class="grid g2"><div class="field"><label for="wEnd">Plan runs until</label><input id="wEnd" type="date" value="${ne}" min="${ns}"></div>
      <div class="field"><label for="wMove">Move to savings now (₹)</label><input id="wMove" class="num" type="number" min="0" inputmode="decimal" value="0"></div></div>
    <div class="grid g2"><div class="field"><label for="wMoveAcct">Take it from</label><select id="wMoveAcct" class="acs">${acctOptions(S.accounts.map((a,i)=>({i,b:+a.bal||0})).sort((x,y)=>y.b-x.b)[0].i)}</select></div>
      <div class="field" style="align-content:end"><button class="btn line" type="button" data-act="wizMoveAll" ${c.free>0?"":"disabled"}>Move all spare (${fmt(Math.max(0,c.free))})</button></div></div>
    <div><h3>Carry over these bills</h3><div class="rows" style="margin-top:8px">${S.bills.length?S.bills.map(b=>`<label class="chk"><input type="checkbox" data-w="bill" value="${b.id}" checked><span>${esc(b.name)}</span><span>${fmt(bv(b))}</span></label>`).join(""):`<p class="hint">No bills.</p>`}</div></div>
    <div><h3>Carry over this income</h3><div class="rows" style="margin-top:8px">${S.incomes.map(b=>`<label class="chk"><input type="checkbox" data-w="inc" value="${b.id}" checked><span>${esc(b.name)}</span><span>${fmt(bv(b))}</span></label>`).join("")}
      <div class="grid g3"><div class="field"><label for="wInName">New income (optional)</label><input id="wInName" placeholder="Salary" maxlength="60"></div>
      <div class="field"><label for="wInAmt">Amount (₹)</label><input id="wInAmt" class="num" type="number" min="0" inputmode="decimal"></div>
      <div class="field"><label for="wInAcct">Into</label><select id="wInAcct" class="acs">${acctOptions(0)}</select></div></div></div></div>
    <div class="field"><label for="wDaily">Day-to-day budget for the month (₹)</label><input id="wDaily" class="num" type="number" min="0" inputmode="decimal" value="${S.daily.amt}"></div>
    <div id="wSug" class="status ok" aria-live="polite"></div>
    <div class="acts"><button class="btn line" type="button" data-act="closeDlg">Cancel</button><button class="btn solid" type="button" data-act="startNext">Start ${monthLabel(ns)}</button></div></div>`;
  dlg.showModal(); wizUpdate();
}
function wizCalc(){
  const c=calc();
  const keptBills=sum(S.bills.filter(b=>document.querySelector(`[data-w=bill][value="${b.id}"]`)?.checked),bv);
  let inc=sum(S.incomes.filter(b=>document.querySelector(`[data-w=inc][value="${b.id}"]`)?.checked),bv);
  inc+=Math.max(0,+$("wInAmt").value||0);
  const acct=+$("wMoveAcct").value;
  const move=Math.min(Math.max(0,+$("wMove").value||0),Math.max(0,+S.accounts[acct].bal||0));
  const end=$("wEnd").value&&$("wEnd").value>=W.ns?$("wEnd").value:W.ne;
  let need=0;
  if(S.goal){ const rem=Math.max(0,S.goal.target-S.savings-move); need=rem/Math.max(1,monthsToGo(end,S.goal.by)) }
  const available=c.cash-move+inc-keptBills;
  return {keptBills,inc,move,need,available,suggested:Math.max(0,available-need),end};
}
function wizUpdate(){
  const s=wizCalc(), d=Math.max(1,Math.round((pd(s.end)-pd(W.ns))/864e5)+1), daily=+$("wDaily").value||0;
  const left=s.available-daily-s.need;
  let msg=`Bills ${fmt(s.keptBills)}, income ${fmt(s.inc)}.`;
  if(S.goal) msg+=` Your goal needs ${fmt(s.need)} this month.`;
  msg+=` Day-to-day budget that fits: ${fmt(s.suggested)} (about ${fmt(s.suggested/d)} a day). `;
  const el=$("wSug");
  if(s.available-s.need<0&&S.goal){ el.className="status bad"; msg+=`Even with ₹0 for day-to-day you'd be ${fmt(s.need-s.available)} short of the goal this month.`; }
  else if(left<0){ el.className="status warn"; msg+=`Your budget of ${fmt(daily)} is ${fmt(-left)} more than that.`; }
  else { el.className="status ok"; msg+=`Your budget leaves ${fmt(left)} spare.`; }
  el.innerHTML=esc(msg)+(Math.round(daily)!==Math.round(s.suggested)?` <button class="link" type="button" data-act="wizSuggest">Use ${fmt(s.suggested)}</button>`:"");
}
function startNext(){
  const P=S.period, s=wizCalc();
  const keepBill=id=>document.querySelector(`[data-w=bill][value="${id}"]`)?.checked;
  const keepInc=id=>document.querySelector(`[data-w=inc][value="${id}"]`)?.checked;
  const newName=$("wInName").value.trim(), newAmt=+$("wInAmt").value||0, newAcct=+$("wInAcct").value;
  const daily=Math.max(0,+$("wDaily").value||0);
  if(s.move>0) addTx({type:"save",amt:s.move,acct:+$("wMoveAcct").value,date:iso(today())>P.end?P.end:iso(today()),note:"Month-end move to savings"});
  const c=calc();
  S.history.push({label:monthLabel(P.end),start:P.start,end:P.end,income:c.incomeIn,bills:c.billsPaid,budget:c.budget,daily:c.dailySpent,adhoc:c.adhoc,
    saved:c.savedNet,cash:c.cash,need:c.g?c.g.need:0,hasGoal:!!c.g&&!c.g.reached});
  S.period={start:W.ns,end:s.end};
  S.bills=S.bills.filter(b=>keepBill(b.id)).map(b=>({...b,paid:false}));
  S.incomes=S.incomes.filter(b=>keepInc(b.id)).map(b=>({...b,got:false}));
  if(newAmt>0) S.incomes.push({id:uid(),name:newName||"Income",amt:newAmt,qty:1,acct:newAcct,got:false});
  S.daily.amt=daily;
  save(); $("dlg").close(); LOGF.range="month"; show("today");
  toast(`${monthLabel(P.end)} closed. ${monthLabel(W.ns)} is ready.`);
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b||b.disabled) return;
  const f=ACT[b.dataset.act]; if(f) f(b,e);
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.closest("#dlg")){ if($("wSug")) wizUpdate(); return }
  if(el.dataset.list){
    const L=el.dataset.list, i=+el.dataset.i, k=el.dataset.k, it=S[L]&&S[L][i]; if(!it) return;
    if(k==="name") it.name=el.value; else it[k]=+el.value||0;
    if(L==="accounts"&&k==="name") document.querySelectorAll("select.acs").forEach(s=>{ const v=s.value; s.innerHTML=acctOptions(v) });
    planOut();
  } else if(el.id==="dAmt"){ S.daily.amt=+el.value||0; planOut() }
  else if(el.id==="endDate"&&el.value&&el.value>=S.period.start){ S.period.end=el.value; planOut() }
  else if(el.id==="afAmt"){ afford(+el.value||0) }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.closest("#dlg")){ if($("wSug")) wizUpdate(); return }
  if(el.dataset.actChange==="togglePaid") return togglePaid(+el.dataset.i,el.checked);
  if(el.dataset.actChange==="toggleGot") return toggleGot(+el.dataset.i,el.checked);
  if(el.dataset.list&&el.dataset.k==="acct"){ S[el.dataset.list][+el.dataset.i].acct=+el.value; planOut() }
  if(el.id==="dAcct"){ S.daily.acct=+el.value; planOut() }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&(e.target.id==="qAmt"||e.target.id==="qNote")){ e.preventDefault(); ACT.qaAdd() }
});
function afford(amt){
  const c=calc(), g=c.g, el=$("afOut"); if(!g||!el) return;
  if(!(amt>0)){ el.className="hint"; el.textContent="Enter an amount to see what it does to this month's savings."; return }
  const after=g.projected-amt, gapAfter=g.need-after;
  if(g.reached){ el.className="status ok"; el.textContent=`Your goal is already reached, so this doesn't put it at risk.`; return }
  if(gapAfter<=0){ el.className="status ok"; el.textContent=`Yes. You'd still save about ${fmt(after)} this month against the ${fmt(g.need)} needed, leaving ${fmt(-gapAfter)} of cushion.`; return }
  const days=Math.round(amt/Math.max(1,g.need)*30.4);
  el.className="status "+(g.gap>0?"bad":"warn");
  el.textContent=`It would leave you ${fmt(gapAfter)} short of this month's saving target, which pushes the goal back by roughly ${days} ${days===1?"day":"days"} of saving.`
    +(c.dailyLeft>=gapAfter?` To absorb it, trim day-to-day spending by ${fmt(gapAfter/c.days)} a day.`:"");
}
$("importFile").addEventListener("change",e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    let o; try{ o=JSON.parse(r.result) }catch(err){ toast("That file isn't a valid backup."); return }
    if(!o||typeof o!=="object"||!Array.isArray(o.accounts)){ toast("That file isn't a Money Plan backup."); return }
    if(!confirm("Replace everything in this browser with the backup?")) return;
    S=normalize(o); save(); render(); toast("Backup restored.");
  };
  r.readAsText(f);
});
document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&iso(today())!==renderedDay&&!$("dlg").open) render(true) });

// sync triggers: coming back to the tab pulls, leaving it flushes pending edits, regaining network retries
document.addEventListener("visibilitychange",()=>{
  if(!SY.on) return;
  if(document.hidden){ if(SY.dirty){ clearTimeout(pushT); push() } } else pull();
});
window.addEventListener("online",()=>{ if(SY.on) pull() });

const h0=(location.hash||"").slice(1);
if(V[h0]) TAB=h0;
persist(); render(true);
if(SY.on){ setSync(SY.dirty?"busy":"ok"); pull() }
else if(SYNC_URL&&!SY.declined) autoConnect();
</script>
</body>
